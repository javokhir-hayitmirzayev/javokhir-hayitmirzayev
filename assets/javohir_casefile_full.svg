  <!-- Dynamic GitHub Stats Script -->
  <script type="text/javascript">
    <
![CDATA[
    (async function()
 {
      const username = 'javohir0609';
      
      try {
        // Fetch user profile
        const userResponse = await fetch(`https://api.github.com/users/${username}`);
        const userData = await userResponse.json();
        
        // Fetch repositories for additional stats
        const reposResponse = await fetch(`https://api.github.com/users/${username}/repos?per_page=100`);
        const reposData = await reposResponse.json();
        
        // Calculate total stars
        const totalStars = reposData.reduce((sum, repo) => sum + repo.stargazers_count, 0);
        
        // Calculate account age
        const createdAt = new Date(userData.created_at);
        const now = new Date();
        const years = Math.floor((now - createdAt) / (365.25 * 24 * 60 * 60 * 1000));
        const months = Math.floor(((now - createdAt) % (365.25 * 24 * 60 * 60 * 1000)) / (30.44 * 24 * 60 * 60 * 1000));
        
        // Update SVG elements
        document.getElementById('stat-commits').textContent = userData.public_repos > 0 ? 'N/A' : '0';
        document.getElementById('stat-repos').textContent = userData.public_repos;
        document.getElementById('stat-followers').textContent = userData.followers;
        document.getElementById('stat-following').textContent = userData.following;
        document.getElementById('stat-stars').textContent = totalStars;
        document.getElementById('stat-prs').textContent = 'N/A';
        document.getElementById('stat-issues').textContent = 'N/A';
        document.getElementById('stat-age').textContent = `${years}y ${months}m`;
        
      } catch (error) {
        console.error('Failed to fetch GitHub stats:', error);
        document.querySelectorAll('[id^="stat-"]').forEach(el => {
          el.textContent = 'Error';
        });
      }
    })();
    ]]>
  </script>
