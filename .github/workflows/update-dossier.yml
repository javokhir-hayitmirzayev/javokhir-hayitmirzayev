name: Update Living Dossier

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate live dossier
        env:
          # The default GITHUB_TOKEN is scoped to this repo only, so it can't see
          # commits/contributions anywhere else. Create a classic PAT with
          # `repo` + `read:user` scopes and store it as the DOSSIER_PAT secret
          # to get real all-time (incl. private) contribution counts. Falls
          # back to the repo-scoped token (partial stats) if unset.
          GITHUB_TOKEN: ${{ secrets.DOSSIER_PAT || secrets.GITHUB_TOKEN }}
        run: python scripts/generate_resume.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/javohir_casefile_live.svg assets/javohir_casefile_live_dark.svg
          if git diff --staged --quiet; then
            echo "No dossier changes"
          else
            git commit -m "chore: refresh live intelligence dossier"
            git push
          fi
